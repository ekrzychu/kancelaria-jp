name: Regression checks

on:
  push:
    branches:
      - main
      - feature/laravel-migration
  pull_request:
    branches:
      - main
      - feature/laravel-migration

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: '3314'
      TEST_DB_USERNAME: kjp_test
    services:
      mariadb:
        image: mariadb:11.4.13@sha256:a8992b5e5404d11e03c54a31d0c1bdea3fd116d283aa6d1a627551f29045309b
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_ROOT_HOST: localhost
        ports:
          - 127.0.0.1:3314:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, dom, intl, mbstring, pdo_mysql, xml, zip
          tools: composer:2.11.3
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked Laravel dependencies
        run: |
          export APP_ENV=testing
          composer install --no-interaction --prefer-dist --no-progress
          composer check-platform-reqs
          composer audit --locked
      - name: Provision the disposable-schema test account
        env:
          DB_CONTAINER: ${{ job.services.mariadb.id }}
        run: |
          test_password="$(openssl rand -hex 24)"
          echo "::add-mask::$test_password"
          {
            printf "CREATE USER 'kjp_test'@'%%' IDENTIFIED BY '%s';\n" "$test_password"
            cat <<'SQL'
          GRANT ALL PRIVILEGES ON `kancelaria\_jp\_test\_%`.* TO 'kjp_test'@'%';
          SQL
          } | docker exec -i "$DB_CONTAINER" mariadb --user=root --protocol=socket
          docker exec "$DB_CONTAINER" mariadb --user=root --protocol=socket --execute 'SELECT VERSION() AS ci_mariadb_version;'
          printf 'TEST_DB_PASSWORD=%s\n' "$test_password" >> "$GITHUB_ENV"
      - run: google-chrome --version
      - name: PHP and JavaScript syntax
        run: node tests/check.mjs
      - name: JSON and content validation
        run: php tests/content.php
      - name: MariaDB migrations and import
        run: node --test tests/database.test.mjs
      - name: HTTP routes and disabled-intake regressions
        run: node --test tests/http.test.mjs
      - name: Browser regressions
        run: node --test tests/browser.test.mjs
      - name: Administrative hostname and CMS regressions
        run: node --test tests/panel.test.mjs
